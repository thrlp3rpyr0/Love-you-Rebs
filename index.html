<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Landing</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #terminal-container {
            text-align: center;
            z-index: 10;
        }

        #status {
            color: #ff3366;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        #message {
            margin-bottom: 20px;
            color: #cccccc;
        }

        #decrypt-btn {
            background-color: #ff3366;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            transition: background 0.3s;
        }

        #decrypt-btn:hover {
            background-color: #e02e5b;
        }

        #subtext {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #666666;
        }

        #heart-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            pointer-events: none;
            transform-origin: center center;
        }

        .floating-text {
            position: absolute;
            color: #ff3366;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.5s ease, transform 0.5s ease;
            font-weight: bold;
        }

        .floating-text.visible {
            opacity: 0.95;
            transform: scale(1);
        }

        /* Animación de latido suave cuando se completa */
        .beating {
            animation: heartBeat 1.3s infinite ease-in-out;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.07); }
            30% { transform: scale(1); }
            45% { transform: scale(1.04); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="terminal-container">
        <div id="status">[system] Initializing heart.PROTOCOL_v2.0...</div>
        <div id="message">> One encrypted package found for you.</div>
        <button id="decrypt-btn">🔓 DECRYPT MESSAGE</button>
        <div id="subtext">(or just click anywhere)</div>
    </div>

    <div id="heart-container"></div>

    <script>
        const btn = document.getElementById('decrypt-btn');
        const terminal = document.getElementById('terminal-container');
        const heartContainer = document.getElementById('heart-container');

        function triggerHeart() {
            terminal.style.display = 'none';
            heartContainer.style.display = 'block';

            const points = [];
            const minDim = Math.min(window.innerWidth, window.innerHeight);
            // Escala grande para que ocupe gran parte de la pantalla
            const scale = minDim / 32; 

            // Algoritmo balanceado: Contorno detallado y relleno limpio (no saturado)
            for (let t = 0; t < Math.PI * 2; t += 0.05) {
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                // Relleno interno espaciado de forma óptima
                for (let r = 0.2; r <= 0.95; r += 0.15) {
                    points.push({
                        x: x * r,
                        y: y * r
                    });
                }
            }

            // Mezclar aleatoriamente para que se dibuje de forma orgánica por todas partes
            points.sort(() => Math.random() - 0.5);

            const spanElements = [];
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // Crear los elementos DOM ocultos
            points.forEach(p => {
                const span = document.createElement('span');
                span.classList.add('floating-text');
                span.innerText = "I love you";

                span.style.left = `${centerX + p.x * scale}px`;
                span.style.top = `${centerY + p.y * scale}px`;

                heartContainer.appendChild(span);
                spanElements.push(span);
            });

            // Mostrar lentamente y de manera fluida
            let index = 0;
            const drawInterval = setInterval(() => {
                // Cantidad pequeña por frame para lograr el efecto de llenado lento
                for (let i = 0; i < 2 && index < spanElements.length; i++, index++) {
                    spanElements[index].classList.add('visible');
                }

                if (index >= spanElements.length) {
                    clearInterval(drawInterval);
                    // Una vez lleno por completo, comienza a latir suavemente
                    setTimeout(() => {
                        heartContainer.classList.add('beating');
                    }, 400);
                }
            }, 45); // Velocidad pausada para apreciar cómo se va formando poco a poco
        }

        btn.addEventListener('click', triggerHeart);
        document.body.addEventListener('click', (e) => {
            if(e.target !== btn && terminal.style.display !== 'none') {
                triggerHeart();
            }
        });
    </script>
</body>
</html>
